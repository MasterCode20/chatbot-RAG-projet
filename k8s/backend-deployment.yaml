apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn-backend
  namespace: sn-career-ai
  labels:
    app: sn-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sn-backend
  template:
    metadata:
      labels:
        app: sn-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: votre-dockerhub/sn-backend:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-secrets
                  key: GROQ_API_KEY
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sn-backend-svc
  namespace: sn-career-ai
spec:
  selector:
    app: sn-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
