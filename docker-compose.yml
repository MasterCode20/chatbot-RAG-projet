services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/chroma_db:/app/chroma_db # Persistance de la base vectorielle
      - ./backend/data:/app/data # Persistance des documents
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000 # Communication réseau interne Docker
    depends_on:
      - backend
    restart: always
