name: DevSecOps Deploy to Oracle VM

on:
  push:
    branches:
      - main # Le déploiement se lance à chaque push sur la branche main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement sécurisé via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.HOST_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: OPENAI_API_KEY
          script: |
            cd ~/chatbot-RAG-projet

            # 1. Mise à jour du code depuis le repo (sans les secrets)
            git pull origin main

            # 2. Injection sécurisée des secrets dans un fichier .env local à la VM
            # Ce fichier ne sera jamais versionné sur Git
            echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env

            # 3. Reconstruction et redémarrage des conteneurs
            sudo docker compose up -d --build
